  --gold-400: #FFD84D; --gold-600: #C98A00; --mint-300: #8CF2D2; --mint-600: #3BA88A; --lav-300: #B9A4FF;
  --frame: var(--pink-400); --frame-hi: var(--pink-200); /* marco de la barra y del banner (pulsa entre ambos) */
}
/* Temas (plan 5.7): solo redefinen variables; el mapa de colores de sprites sale de aquí y de THEME_SPRITES en main.js */
[data-theme="bubblegum"] { /* rosa chicle + menta, más "pop" */
  --pink-700: #C21F86; --pink-500: #FF4FB6; --pink-400: #FF85CC; --pink-200: #FFC2E6; --pink-100: #FFF2FA;
  --plum-800: #3E1A4F; --plum-600: #6B2E80; --mint-300: #6FF0C8;
  --frame: #6FF0C8; --frame-hi: #C9FFEE;
}
[data-theme="strawberry"] { /* fresa y crema */
  --ink: #2E0E16; --plum-800: #5A1A2A; --plum-600: #8A3346;
  --pink-700: #A82848; --pink-500: #E8466B; --pink-400: #F27A93; --pink-200: #FFC2CC; --pink-100: #FFF3E6;
  --frame: #FFF3E6; --frame-hi: #F27A93;
}
[data-theme="sakura-night"] { /* noche con farolillos: fondo tinta, pétalos lavanda, estrellas doradas */
  --ink: #120818; --plum-800: #1E0E2C; --plum-600: #3B2257;
  --frame: #B9A4FF; --frame-hi: #E2D9FF;
}

html, body { margin: 0; background: transparent; overflow: hidden; }
#widget { position: relative; width: calc(480 * var(--u)); height: calc(135 * var(--u)); overflow: hidden;
  font-family: var(--font); font-size: calc(8 * var(--u)); line-height: 1; color: var(--pink-100); text-transform: uppercase;
  -webkit-font-smoothing: none; text-rendering: optimizeSpeed; image-rendering: pixelated; }
#widget canvas { image-rendering: pixelated; }
#back, #front { position: absolute; left: 0; top: 0; width: calc(480 * var(--u)); height: calc(135 * var(--u)); pointer-events: none; }
.px { position: absolute; box-sizing: border-box; left: calc(var(--x, 0) * var(--u)); top: calc(var(--y, 0) * var(--u));
  width: calc(var(--w, 0) * var(--u)); height: calc(var(--h, 0) * var(--u)); }
.ol { text-shadow: var(--u) 0 var(--ink), calc(-1 * var(--u)) 0 var(--ink), 0 var(--u) var(--ink), 0 calc(-1 * var(--u)) var(--ink); white-space: nowrap; }
.r { text-align: right; } .c { text-align: center; }
#frame { background: var(--ink); }
#mid { background: var(--frame);
  box-shadow: inset var(--u) var(--u) 0 var(--pink-100), inset calc(-1 * var(--u)) calc(-1 * var(--u)) 0 var(--plum-600); }
#track { background: var(--plum-800); overflow: hidden; --mask: repeating-linear-gradient(90deg, #000 0 calc(6 * var(--u)), transparent calc(6 * var(--u)) calc(8 * var(--u))); }
#empty { background: var(--plum-600); -webkit-mask-image: var(--mask); mask-image: var(--mask); }
.bars { width: calc(var(--blocks, 0) * 8 * var(--u)); overflow: hidden; -webkit-mask-image: var(--mask); mask-image: var(--mask);
  background: linear-gradient(to bottom, var(--pink-200) 0 calc(4 * var(--u)), var(--pink-500) calc(4 * var(--u)) calc(16 * var(--u)), var(--pink-700) calc(16 * var(--u)) 100%); }
#fill2, #fill.gold { background: linear-gradient(to bottom, var(--pink-100) 0 calc(4 * var(--u)), var(--gold-400) calc(4 * var(--u)) calc(16 * var(--u)), var(--gold-600) calc(16 * var(--u)) 100%); }
#shine { position: absolute; top: 0; height: 100%; width: calc(16 * var(--u)); display: none;
  background: repeating-conic-gradient(var(--pink-100) 0 25%, transparent 0 50%) 0 0 / calc(2 * var(--u)) calc(2 * var(--u)); }
#tip { background: var(--pink-100); display: none; animation: tipblink 1s steps(1) infinite; }
#tip.gold { background: var(--gold-400); }
#big, #float, #barPct { display: none; }
#widget.pct-in-bar #barPct { display: block; }
#big { font-size: calc(16 * var(--u)); }
#big span { display: inline-block; position: relative; }
#widget.celebrating #amounts, #widget.celebrating #ticker, #widget.bigtext #amounts, #widget.bigtext #ticker { visibility: hidden; }
#fill.tint-mint { background: linear-gradient(to bottom, var(--pink-100) 0 calc(4 * var(--u)), var(--mint-300) calc(4 * var(--u)) calc(16 * var(--u)), var(--mint-600) calc(16 * var(--u)) 100%); }
#fill.tint-lav { background: linear-gradient(to bottom, var(--pink-100) 0 calc(4 * var(--u)), var(--lav-300) calc(4 * var(--u)) calc(16 * var(--u)), var(--plum-600) calc(16 * var(--u)) 100%); }
#banner { background: var(--plum-800); border: var(--u) solid var(--frame); box-shadow: 0 0 0 var(--u) var(--ink); transform: translateX(calc(480 * var(--u))); }
#bAmt { color: var(--gold-400); } #bMsg { color: var(--pink-200); overflow: hidden; white-space: nowrap; }
.flag { image-rendering: pixelated; }
#dbg { position: fixed; left: 0; top: calc(135 * var(--u) + 6px); font: 11px monospace; color: #fff; background: #000a; padding: 4px; text-transform: none; }
#dbg button { font: 11px monospace; margin: 1px; }

/* Todo por pasos: nada de ease/linear continuo en la barra */
@keyframes tipblink { 0% { background-color: var(--pink-100); } 50% { background-color: var(--pink-200); } }
@keyframes pulse { 0% { background-color: var(--frame); } 50% { background-color: var(--frame-hi); } }
#mid { animation: pulse 1s steps(1) infinite; }
#mid.flash { animation: none; background-color: var(--pink-100); }
#mid.gflash { animation: none; background-color: var(--gold-400); }
#tip.gold { animation: none; }
@media (prefers-reduced-motion: reduce) { #mid, #tip { animation: none; } }
